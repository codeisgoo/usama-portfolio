name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Find build output and prepare for Pages
        run: |
          for dir in .output/public dist/client dist build/client build; do
            if [ -f "$dir/index.html" ]; then
              OUTPUT_DIR="$dir"
              break
            fi
          done

          if [ -z "$OUTPUT_DIR" ]; then
            echo "No index.html found. Folders that contain one:"
            find . -name index.html -not -path "./node_modules/*"
            echo "Build folders present:"
            ls -la . .output dist 2>/dev/null || true
            exit 1
          fi

          echo "Using $OUTPUT_DIR"
          cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"
          touch "$OUTPUT_DIR/.nojekyll"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
