name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare Pages folder
        run: |
          OUTPUT_DIR=.output/public
          echo "Contents of $OUTPUT_DIR:"
          ls -la "$OUTPUT_DIR"

          if [ ! -f "$OUTPUT_DIR/index.html" ]; then
            if [ -f "$OUTPUT_DIR/_shell.html" ]; then
              cp "$OUTPUT_DIR/_shell.html" "$OUTPUT_DIR/index.html"
            else
              echo "No index.html or _shell.html found. SPA mode is not enabled in vite.config.ts."
              exit 1
            fi
          fi

          cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"
          touch "$OUTPUT_DIR/.nojekyll"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
